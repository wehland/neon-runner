<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON RUNNER — Three.js Technical Demo</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <header class="brand">
        <h1>NEON RUNNER</h1>
        <p class="subtitle">Three.js Technical Demo</p>
      </header>

      <div
        id="hud"
        data-mode="start"
        data-lane="0"
        data-grounded="true"
        data-energy="0"
        data-distance="0"
        data-speed="0"
        data-heading="0"
        data-elev="0"
        data-break-ahead="false"
        data-obstacles="0"
        data-orbs="0"
        data-segments="18"
        data-muted="false"
        data-audio-unlocked="false"
        data-last-sfx="none"
        data-sfx-jump="0"
        data-sfx-collect="0"
        data-sfx-crash="0"
      >
        <div>Distance <span id="hud-distance">0</span> m</div>
        <div>Energy <span id="hud-energy">0</span></div>
        <div>Speed <span id="hud-speed">0</span></div>
      </div>

      <button id="btn-sound" type="button" data-sound="on">Sound: ON</button>

      <div class="controls">
        <div><kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd> Move</div>
        <div><kbd>SPACE</kbd> Jump</div>
      </div>

      <div class="tech">Three.js · TypeScript · Vite</div>

      <div id="overlay-start" class="overlay">
        <h2>NEON RUNNER</h2>
        <p>Three.js Technical Demo</p>
        <button id="btn-start" type="button">Start</button>
      </div>

      <div id="overlay-gameover" class="overlay hidden">
        <h2>Run Over</h2>
        <p>Distance <span id="final-distance">0</span> m</p>
        <p>Energy <span id="final-energy">0</span></p>
        <button id="btn-again" type="button">Run Again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
